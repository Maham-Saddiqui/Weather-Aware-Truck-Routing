[project]
name = "weather-aware-truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
    "httpx>=0.28.1",
    "tzfpy>=2.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "PL", "RUF", "S", "DTZ", "DJ", "PERF", "T20", "FBT", "A", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 10
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"manage.py" = ["PLC0415"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.importlinter]
root_packages = ["domain", "providers", "services", "trips"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward (BE-01)"
type = "layers"
layers = ["trips", "services", "providers", "domain"]

[[tool.importlinter.contracts]]
name = "Domain imports only the standard library (BE-01)"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["django", "rest_framework", "httpx", "yaml", "tzfpy", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
env = [
  "DJANGO_SECRET_KEY=test-only-secret-key-not-used-anywhere",
  "DJANGO_DEBUG=true",
  "DJANGO_ALLOWED_HOSTS=testserver,localhost",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.5",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
