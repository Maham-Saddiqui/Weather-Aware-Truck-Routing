name: keep-warm

# The free server sleeps after 15 idle minutes and takes about a minute to wake;
# a ping every 10 minutes keeps it awake. Scheduled runs are best effort.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 "${API_HEALTH_URL}"
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://truck-weather-api-oh5h.onrender.com/api/v1/health' }}
