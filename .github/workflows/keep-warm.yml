name: keep-warm

# The free server sleeps after 15 idle minutes and takes 20 to 50 seconds to wake.
# This ping every 10 minutes is a best-effort backup to the outside scheduler (cron-job.org,
# every 5 minutes, not part of this repository); scheduled runs can be late or skipped.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 "${API_HEALTH_URL}"
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://truck-weather-api-oh5h.onrender.com/api/v1/health' }}
